<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SVG Blob Engine</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #10131a;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }
    #stage {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }
    #toolbar {
      position: fixed;
      top: 12px;
      left: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      max-width: calc(100vw - 24px);
    }
    #toolbar button, #toolbar select {
      font: inherit;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #3a4152;
      background: #1e2431;
      color: #dfe4ee;
      cursor: pointer;
    }
    #toolbar button:hover, #toolbar select:hover { background: #2a3244; }
    #toolbar button.active {
      background: #3a4a63;
      border-color: #5b7ca8;
    }
    #toolbar button:disabled {
      opacity: 0.4;
      cursor: default;
    }
    .divider {
      width: 1px;
      align-self: stretch;
      background: #2a3244;
      margin: 2px 2px;
    }
    #gravity-magnitude {
      width: 100px;
    }
    #status {
      font-size: 12px;
      color: #8b93a7;
    }

    #inspector {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 220px;
      background: #1a1f2b;
      border: 1px solid #3a4152;
      border-radius: 8px;
      padding: 12px;
      color: #dfe4ee;
      font-size: 13px;
      display: none;
    }
    #inspector.visible { display: block; }
    #inspector h3 {
      margin: 0 0 10px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #inspector .close-btn {
      cursor: pointer;
      color: #8b93a7;
      font-size: 16px;
      line-height: 1;
    }
    #inspector label {
      display: block;
      margin-top: 8px;
      font-size: 11px;
      color: #8b93a7;
    }
    #inspector input {
      width: 100%;
      box-sizing: border-box;
      margin-top: 3px;
      background: #10131a;
      border: 1px solid #3a4152;
      border-radius: 4px;
      color: #dfe4ee;
      font: inherit;
      padding: 4px 6px;
    }
    #inspector input[type="color"] {
      padding: 2px;
      height: 28px;
    }
    #delete-btn {
      margin-top: 12px;
      width: 100%;
      font: inherit;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #6a3a3a;
      background: #2b1e22;
      color: #e0a0a0;
      cursor: pointer;
    }
    #delete-btn:hover { background: #3a2428; }

    #gravity-marker {
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="mode-setup-btn" class="active">Setup</button>
    <button id="mode-run-btn">Run</button>
    <div class="divider"></div>
    <button id="save-btn">Save Scene</button>
    <button id="open-btn">Open Scene</button>
    <div class="divider"></div>
    <select id="gravity-mode">
      <option value="uniform">Gravity: Earth</option>
      <option value="point">Gravity: Point</option>
    </select>
    <input id="gravity-magnitude" type="range" min="0" max="2000" step="10" value="900" title="Gravity strength" />
    <button id="place-gravity-btn" disabled>Place Point</button>
    <span id="status">Click the stage to drop a ball</span>
  </div>

  <div id="inspector">
    <h3>Ball <span class="close-btn" id="inspector-close">&times;</span></h3>
    <label>Radius<input id="prop-radius" type="number" min="4" max="120" step="1" /></label>
    <label>Color<input id="prop-color" type="color" /></label>
    <label>Restitution (elasticity)<input id="prop-restitution" type="number" min="0" max="1" step="0.01" /></label>
    <label>Friction<input id="prop-friction" type="number" min="0" max="1" step="0.01" /></label>
    <button id="delete-btn">Delete</button>
  </div>

  <svg id="stage" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="800" height="600" fill="#1a1f2b" />
    <rect id="floor" x="0" y="560" width="800" height="40" fill="#232a39" />
    <g id="world"></g>
    <g id="gravity-marker" style="display: none">
      <circle r="6" fill="none" stroke="#e0d15e" stroke-width="2" />
      <line x1="-10" y1="0" x2="10" y2="0" stroke="#e0d15e" stroke-width="1" />
      <line x1="0" y1="-10" x2="0" y2="10" stroke="#e0d15e" stroke-width="1" />
    </g>
  </svg>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
