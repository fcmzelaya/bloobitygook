<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SVG Blob Engine</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #10131a;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }
    #stage {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }
    #toolbar {
      position: fixed;
      top: 12px;
      left: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #toolbar button {
      font: inherit;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #3a4152;
      background: #1e2431;
      color: #dfe4ee;
      cursor: pointer;
    }
    #toolbar button:hover { background: #2a3244; }
    #status {
      font-size: 12px;
      color: #8b93a7;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="save-btn">Save Scene</button>
    <button id="open-btn">Open Scene</button>
    <span id="status">Click the stage to drop a ball</span>
  </div>
  <svg id="stage" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="800" height="600" fill="#1a1f2b" />
    <rect id="floor" x="0" y="560" width="800" height="40" fill="#232a39" />
    <g id="world"></g>
  </svg>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
