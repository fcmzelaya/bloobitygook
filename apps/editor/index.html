<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>bloobitygook — editor</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #10131a;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }
    #stage {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }
    #toolbar {
      position: fixed;
      top: 12px;
      left: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      max-width: calc(100vw - 24px);
    }
    #toolbar button, #toolbar select, #toolbar input[type="text"] {
      font: inherit;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #3a4152;
      background: #1e2431;
      color: #dfe4ee;
      cursor: pointer;
    }
    #toolbar input[type="text"] { cursor: text; }
    #toolbar button:hover, #toolbar select:hover { background: #2a3244; }
    #toolbar button.active {
      background: #3a4a63;
      border-color: #5b7ca8;
    }
    #toolbar button:disabled {
      opacity: 0.4;
      cursor: default;
    }
    .divider {
      width: 1px;
      align-self: stretch;
      background: #2a3244;
      margin: 2px 2px;
    }
    #gravity-magnitude {
      width: 100px;
    }
    #toolbar input#scene-id {
      width: 90px;
    }
    .hidden {
      display: none !important;
    }
    #status {
      font-size: 12px;
      color: #8b93a7;
    }

    #inspector {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 220px;
      background: #1a1f2b;
      border: 1px solid #3a4152;
      border-radius: 8px;
      padding: 12px;
      color: #dfe4ee;
      font-size: 13px;
      display: none;
    }
    #inspector.visible { display: block; }
    #inspector h3 {
      margin: 0 0 10px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #inspector .close-btn {
      cursor: pointer;
      color: #8b93a7;
      font-size: 16px;
      line-height: 1;
    }
    #inspector label {
      display: block;
      margin-top: 8px;
      font-size: 11px;
      color: #8b93a7;
    }
    #inspector input {
      width: 100%;
      box-sizing: border-box;
      margin-top: 3px;
      background: #10131a;
      border: 1px solid #3a4152;
      border-radius: 4px;
      color: #dfe4ee;
      font: inherit;
      padding: 4px 6px;
    }
    #inspector input[type="color"] {
      padding: 2px;
      height: 28px;
    }
    #delete-btn {
      margin-top: 12px;
      width: 100%;
      font: inherit;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #6a3a3a;
      background: #2b1e22;
      color: #e0a0a0;
      cursor: pointer;
    }
    #delete-btn:hover { background: #3a2428; }

    #gravity-marker {
      pointer-events: none;
    }

    #games-panel {
      position: fixed;
      bottom: 12px;
      left: 12px;
      width: 260px;
      background: #1a1f2b;
      border: 1px solid #3a4152;
      border-radius: 8px;
      padding: 12px;
      color: #dfe4ee;
      font-size: 13px;
      display: none;
    }
    #games-panel.visible { display: block; }
    #games-panel h3 {
      margin: 0 0 10px;
      font-size: 13px;
    }
    #games-panel label {
      display: block;
      margin-top: 8px;
      font-size: 11px;
      color: #8b93a7;
    }
    #games-panel input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      margin-top: 3px;
      background: #10131a;
      border: 1px solid #3a4152;
      border-radius: 4px;
      color: #dfe4ee;
      font: inherit;
      padding: 4px 6px;
    }
    #games-panel .checkbox-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }
    #games-panel .checkbox-row label {
      margin-top: 0;
    }
    #save-game-btn {
      margin-top: 12px;
      width: 100%;
      font: inherit;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #3a4152;
      background: #1e2431;
      color: #dfe4ee;
      cursor: pointer;
    }
    #save-game-btn:hover { background: #2a3244; }
    #save-game-btn:disabled { opacity: 0.4; cursor: default; }
    #games-list {
      margin-top: 12px;
      font-size: 12px;
      color: #8b93a7;
      max-height: 120px;
      overflow-y: auto;
    }
    #games-list div {
      padding: 3px 0;
      cursor: pointer;
    }
    #games-list div:hover {
      color: #dfe4ee;
    }

    #wizard-panel {
      position: fixed;
      bottom: 12px;
      left: 292px;
      width: 280px;
      background: #1a1f2b;
      border: 1px solid #3a4152;
      border-radius: 8px;
      padding: 12px;
      color: #dfe4ee;
      font-size: 13px;
      display: none;
    }
    #wizard-panel.visible { display: block; }
    #wizard-panel h3 {
      margin: 0 0 4px;
      font-size: 13px;
    }
    #wizard-panel .hint {
      font-size: 11px;
      color: #8b93a7;
      margin: 0 0 8px;
    }
    #wizard-panel label {
      display: block;
      margin-top: 8px;
      font-size: 11px;
      color: #8b93a7;
    }
    #wizard-panel input {
      width: 100%;
      box-sizing: border-box;
      margin-top: 3px;
      background: #10131a;
      border: 1px solid #3a4152;
      border-radius: 4px;
      color: #dfe4ee;
      font: inherit;
      padding: 4px 6px;
    }
    #forget-token-btn {
      background: none;
      border: none;
      color: #6b7284;
      font-size: 11px;
      cursor: pointer;
      padding: 0;
      margin-top: 4px;
      text-decoration: underline;
    }
    #create-pr-btn {
      margin-top: 12px;
      width: 100%;
      font: inherit;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #3a4152;
      background: #1e2431;
      color: #dfe4ee;
      cursor: pointer;
    }
    #create-pr-btn:hover { background: #2a3244; }
    #create-pr-btn:disabled { opacity: 0.4; cursor: default; }
    #wizard-status {
      margin-top: 10px;
      font-size: 12px;
      color: #8b93a7;
      word-break: break-word;
    }
    #wizard-status a {
      color: #7ea8d8;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/main.jsx"></script>
</body>
</html>
