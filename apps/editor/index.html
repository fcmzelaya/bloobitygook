<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>bloobitygook — editor</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #10131a;
      font-family: system-ui, sans-serif;
      color: #dfe4ee;
    }

    #app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 14px;
      background: #161a24;
      border-bottom: 1px solid #2a3244;
      box-sizing: border-box;
    }
    #app-title {
      font-size: 13px;
      font-weight: 600;
      color: #dfe4ee;
      white-space: nowrap;
    }
    #dashboard-link {
      color: #7ea8d8;
      text-decoration: none;
      font-size: 13px;
    }
    #dashboard-link:hover { text-decoration: underline; }
    #app-header #status {
      flex: 1;
      font-size: 12px;
      color: #8b93a7;
    }
    #app-header-actions {
      display: flex;
      gap: 8px;
    }
    #app-header-actions button {
      font: inherit;
      font-size: 13px;
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid #3a4152;
      background: #1e2431;
      color: #dfe4ee;
      cursor: pointer;
    }
    #app-header-actions button:hover { background: #2a3244; }

    /* Dashboard */
    #dashboard {
      max-width: 640px;
      margin: 0 auto;
      padding: 76px 20px 40px;
    }
    #dashboard h1 {
      font-size: 20px;
      margin: 0 0 16px;
    }
    /* Reusable small explanatory text, wherever a control needs a line of
       "what this does" without cluttering the label itself. */
    .editor-hint {
      font-size: 12px;
      line-height: 1.5;
      color: #8b93a7;
      margin: 6px 0 0;
    }
    #dashboard-intro {
      background: #161a24;
      border: 1px solid #2a3244;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 20px;
      font-size: 13px;
      line-height: 1.6;
    }
    #dashboard-intro p {
      margin: 0 0 8px;
    }
    #dashboard-intro ul {
      margin: 0 0 8px;
      padding-left: 18px;
    }
    #dashboard-intro li {
      margin-bottom: 4px;
    }
    #dashboard-intro .editor-hint {
      margin-top: 4px;
    }
    #dashboard-games-list {
      list-style: none;
      margin: 0;
      padding: 0;
      font-size: 14px;
    }
    #dashboard-games-list li {
      padding: 8px 0;
      border-bottom: 1px solid #232a39;
    }
    #dashboard-games-list a {
      color: #dfe4ee;
      text-decoration: none;
      font-weight: 600;
    }
    #dashboard-games-list a:hover { color: #7ea8d8; }
    #dashboard-error { color: #e0a0a0; font-size: 13px; }
    #dashboard-new-section {
      margin-top: 24px;
    }
    #dashboard-new-listing {
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }
    #dashboard-new-listing label {
      display: block;
      font-size: 11px;
      color: #8b93a7;
    }
    #dashboard-new-listing input {
      display: block;
      margin-top: 3px;
      background: #1a1f2b;
      border: 1px solid #3a4152;
      border-radius: 4px;
      color: #dfe4ee;
      font: inherit;
      padding: 5px 8px;
    }
    #dashboard-open-btn {
      font: inherit;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #3a4152;
      background: #1e2431;
      color: #dfe4ee;
      cursor: pointer;
    }
    #dashboard-open-btn:hover { background: #2a3244; }

    /* Per-game editor */
    #game-editor {
      padding-top: 44px;
    }
    #no-scene-note {
      max-width: 340px;
      margin: 20px;
      font-size: 13px;
      color: #8b93a7;
    }

    #game-metadata-form {
      position: fixed;
      top: 56px;
      left: 12px;
      width: 260px;
      z-index: 10;
      background: #1a1f2b;
      border: 1px solid #3a4152;
      border-radius: 8px;
      padding: 12px;
      color: #dfe4ee;
      font-size: 13px;
    }
    #game-metadata-form label {
      display: block;
      margin-top: 8px;
      font-size: 11px;
      color: #8b93a7;
    }
    #game-metadata-form input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      margin-top: 3px;
      background: #10131a;
      border: 1px solid #3a4152;
      border-radius: 4px;
      color: #dfe4ee;
      font: inherit;
      padding: 4px 6px;
    }
    #game-metadata-form input:disabled {
      opacity: 0.5;
    }
    #game-metadata-form .checkbox-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }
    #game-metadata-form .checkbox-row label {
      margin-top: 0;
    }
    #game-form-error {
      margin-top: 8px;
      font-size: 12px;
      color: #e0a0a0;
    }
    #game-metadata-form .form-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    #game-metadata-form .form-actions button {
      flex: 1;
      font: inherit;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #3a4152;
      background: #1e2431;
      color: #dfe4ee;
      cursor: pointer;
    }
    #game-metadata-form .form-actions button:hover { background: #2a3244; }
    #game-metadata-form .form-actions button:disabled { opacity: 0.4; cursor: default; }

    /* Canvas editing (Stage + Toolbar + Inspector), only rendered when a
       game has a sceneId */
    #stage {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }
    #toolbar {
      position: fixed;
      top: 56px;
      left: 292px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      max-width: calc(100vw - 304px);
      z-index: 10;
    }
    #toolbar button, #toolbar select {
      font: inherit;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #3a4152;
      background: #1e2431;
      color: #dfe4ee;
      cursor: pointer;
    }
    #toolbar button:hover, #toolbar select:hover { background: #2a3244; }
    #toolbar button.active {
      background: #3a4a63;
      border-color: #5b7ca8;
    }
    #toolbar button:disabled {
      opacity: 0.4;
      cursor: default;
    }
    .divider {
      width: 1px;
      align-self: stretch;
      background: #2a3244;
      margin: 2px 2px;
    }
    #gravity-magnitude {
      width: 100px;
    }

    /* Palette — which object a stage click places next, grouped by
       category. Sits below the Toolbar at the same left offset. */
    #palette {
      position: fixed;
      top: 100px;
      left: 292px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      max-width: calc(100vw - 304px);
      z-index: 10;
    }
    #palette-hint {
      flex-basis: 100%;
      margin: 0 0 2px;
    }
    .palette-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .palette-group-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #6b7284;
      margin-right: 2px;
    }
    .palette-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      font: inherit;
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid #3a4152;
      background: #1e2431;
      color: #dfe4ee;
      cursor: pointer;
    }
    .palette-btn:hover { background: #2a3244; }
    .palette-btn.active {
      background: #3a4a63;
      border-color: #5b7ca8;
    }
    .palette-swatch {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--swatch, #8b93a7);
    }

    #inspector {
      position: fixed;
      top: 56px;
      right: 12px;
      width: 220px;
      background: #1a1f2b;
      border: 1px solid #3a4152;
      border-radius: 8px;
      padding: 12px;
      color: #dfe4ee;
      font-size: 13px;
      display: none;
      z-index: 10;
    }
    #inspector.visible { display: block; }
    #inspector h3 {
      margin: 0 0 10px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #inspector .close-btn {
      cursor: pointer;
      color: #8b93a7;
      font-size: 16px;
      line-height: 1;
    }
    #inspector label {
      display: block;
      margin-top: 8px;
      font-size: 11px;
      color: #8b93a7;
    }
    #inspector input {
      width: 100%;
      box-sizing: border-box;
      margin-top: 3px;
      background: #10131a;
      border: 1px solid #3a4152;
      border-radius: 4px;
      color: #dfe4ee;
      font: inherit;
      padding: 4px 6px;
    }
    #inspector input[type="color"] {
      padding: 2px;
      height: 28px;
    }
    #delete-btn {
      margin-top: 12px;
      width: 100%;
      font: inherit;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #6a3a3a;
      background: #2b1e22;
      color: #e0a0a0;
      cursor: pointer;
    }
    #delete-btn:hover { background: #3a2428; }

    #gravity-marker {
      pointer-events: none;
    }

    /* New Game wizard — a centered overlay, reachable from any route */
    #wizard-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 280px;
      background: #1a1f2b;
      border: 1px solid #3a4152;
      border-radius: 8px;
      padding: 12px;
      color: #dfe4ee;
      font-size: 13px;
      display: none;
      z-index: 30;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    #wizard-panel.visible { display: block; }
    #wizard-panel h3 {
      margin: 0 0 4px;
      font-size: 13px;
    }
    #wizard-panel .hint {
      font-size: 11px;
      color: #8b93a7;
      margin: 0 0 8px;
    }
    #wizard-panel label {
      display: block;
      margin-top: 8px;
      font-size: 11px;
      color: #8b93a7;
    }
    #wizard-panel input {
      width: 100%;
      box-sizing: border-box;
      margin-top: 3px;
      background: #10131a;
      border: 1px solid #3a4152;
      border-radius: 4px;
      color: #dfe4ee;
      font: inherit;
      padding: 4px 6px;
    }
    #forget-token-btn {
      background: none;
      border: none;
      color: #6b7284;
      font-size: 11px;
      cursor: pointer;
      padding: 0;
      margin-top: 4px;
      text-decoration: underline;
    }
    #create-pr-btn {
      margin-top: 12px;
      width: 100%;
      font: inherit;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #3a4152;
      background: #1e2431;
      color: #dfe4ee;
      cursor: pointer;
    }
    #create-pr-btn:hover { background: #2a3244; }
    #create-pr-btn:disabled { opacity: 0.4; cursor: default; }
    #wizard-status {
      margin-top: 10px;
      font-size: 12px;
      color: #8b93a7;
      word-break: break-word;
    }
    #wizard-status a {
      color: #7ea8d8;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/main.jsx"></script>
</body>
</html>
