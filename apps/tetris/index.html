<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>bloobitygook — tetris</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #10131a;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      color: #dfe4ee;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #layout {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }
    #stage {
      display: block;
      border: 1px solid #3a4152;
      border-radius: 4px;
    }
    #panel {
      width: 160px;
      font-size: 13px;
    }
    #panel h1 {
      font-size: 16px;
      margin: 0 0 12px;
    }
    #score {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    #status {
      color: #8b93a7;
      line-height: 1.5;
    }
    #status.game-over {
      color: #e0a0a0;
      font-weight: 600;
    }
    #controls {
      margin-top: 16px;
      color: #6b7284;
      font-size: 11px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="layout">
    <svg id="stage" viewBox="0 0 240 480" width="240" height="480">
      <rect x="0" y="0" width="240" height="480" fill="#1a1f2b" />
      <g id="world"></g>
    </svg>
    <div id="panel">
      <h1>Tetris</h1>
      <div id="score">0</div>
      <div id="status">Arrow keys to play</div>
      <div id="controls">
        &larr;/&rarr; move<br />
        &darr; soft drop<br />
        &uarr; rotate
      </div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
