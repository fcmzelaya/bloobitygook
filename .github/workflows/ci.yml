name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --filter @bloobitygook/hub build
      - run: pnpm --filter @bloobitygook/play build
      - run: pnpm --filter @bloobitygook/tetris build
      - run: pnpm --filter @bloobitygook/pacman build
      # publish.js/games-storage.js degrade gracefully without
      # VITE_FIREBASE_* set (cloud UI stays hidden, nothing throws), so
      # this build is a real check even without repo secrets available —
      # e.g. on PRs from forks.
      - run: pnpm --filter @bloobitygook/editor build
      - run: pnpm compose
